<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Endo — an experiment for the balanced</title>
  <meta name="description" content="Endo is a very friendly fork of Zed with Suzuri's reading features and first-class opencode support. An experiment for the balanced.">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <meta property="og:title" content="Endo">
  <meta property="og:description" content="An experiment for the balanced.">
  <meta property="og:image" content="assets/endo-screenshot.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/base.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    main { flex: 1; }
    .hero { text-align: center; padding: 104px 0 64px; }
    .hero .mark { width: 72px; height: 72px; margin-bottom: 36px; }
    .hero h1 { font-size: clamp(32px, 5.4vw, 56px); line-height: 1.1; font-weight: 500; letter-spacing: -0.03em; margin: 0 0 20px; }
    .cursor { display: inline-block; width: 0.5em; height: 0.95em; background: var(--frame); vertical-align: -0.1em; margin-left: 6px; animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
    .hero p { color: var(--muted); max-width: 620px; margin: 0 auto 36px; }
    .hero p code { color: var(--amber); }
    .cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 6px; font-size: 14px; border: 1px solid var(--line-2); color: var(--text); background: var(--panel-2); }
    .btn:hover { text-decoration: none; border-color: var(--frame); }
    .btn.primary { background: var(--text); color: #0b0c0d; border-color: var(--text); font-weight: 500; }
    .btn.primary:hover { background: #fff; border-color: #fff; }
    .shot { padding: 0 0 56px; }
    .shot figure { margin: 0; border: 1px solid var(--frame); border-radius: 12px; overflow: hidden; background: var(--panel); box-shadow: 0 0 0 6px rgba(121,159,245,0.06), 0 40px 100px -30px rgba(0,0,0,1); }
    .shot img { display: block; width: 100%; height: auto; }
    .soon { text-align: center; padding: 0 0 88px; font-size: 14px; color: var(--muted); }
    .soon .pill { display: inline-block; font-size: 12px; color: var(--amber); border: 1px solid rgba(229,181,103,0.35); border-radius: 999px; padding: 2px 12px; margin-right: 10px; }
    @media (max-width: 760px) { .hero { padding: 72px 0 48px; } }
  </style>
</head>
<body>

<nav>
  <div class="wrap">
    <a class="brand" href="./" aria-label="Endo home"><img src="assets/endo-mark-dark.svg" alt="">endo</a>
    <ul>
      <li><a href="manifesto.html">Manifesto</a></li>
      <li><a href="https://github.com/somtooo/Endo">GitHub</a></li>
    </ul>
  </div>
</nav>

<main>
  <header class="hero">
    <div class="wrap">
      <img class="mark" src="assets/endo-mark-dark.svg" alt="Endo logo">
      <h1>An experiment for the balanced.<span class="cursor" aria-hidden="true"></span></h1>
      <p>A very friendly fork of <code>Zed</code>, with the reading features from <code>Suzuri</code> and first-class support for <code>opencode</code>.</p>
      <div class="cta">
        <a class="btn primary" href="manifesto.html">Read the manifesto</a>
      </div>
    </div>
  </header>

  <section class="shot">
    <div class="wrap">
      <figure>
        <img src="assets/endo-screenshot.webp" width="2522" height="1562" alt="Endo editor with a thread list, two Rust files open side by side, and an opencode agent panel">
      </figure>
    </div>
  </section>

  <p class="soon"><span class="pill">coming soon</span>Feature showcase</p>
</main>

<footer>
  <div class="wrap">
    <span><span class="mode">-- NORMAL --</span> &nbsp;endo</span>
    <span class="right">
      <a href="https://github.com/somtooo/Endo">GitHub</a>
      <a href="https://zed.dev">Zed</a>
      <a href="https://suzuri.ai/">Suzuri</a>
      <a href="https://opencode.ai/">opencode</a>
    </span>
  </div>
</footer>

</body>
</html>
