[package]
name = "opencode_agent"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/opencode_agent.rs"
doctest = false

[features]
test-support = []

[dependencies]
acp_thread.workspace = true
action_log.workspace = true
agent-client-protocol.workspace = true
agent_servers.workspace = true
agent_settings.workspace = true
agent_ui.workspace = true
anyhow.workspace = true
async-compression.workspace = true
async-tar.workspace = true
base64.workspace = true
chrono.workspace = true
collections.workspace = true
db.workspace = true
diffy.workspace = true
editor.workspace = true
extension_host.workspace = true
fs.workspace = true
futures.workspace = true
gpui.workspace = true
http_client.workspace = true
language_model.workspace = true
log.workspace = true
menu.workspace = true
parking_lot.workspace = true
paths.workspace = true
percent-encoding.workspace = true
picker.workspace = true
project.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
settings.workspace = true
settings_json = { workspace = true, features = ["editing"] }
sha2.workspace = true
smol.workspace = true
ui.workspace = true
util.workspace = true
watch.workspace = true
which.workspace = true
zed_actions.workspace = true
workspace.workspace = true

[dev-dependencies]
acp_thread = { workspace = true, features = ["test-support"] }
agent_ui = { workspace = true, features = ["test-support"] }
db = { workspace = true, features = ["test-support"] }
fs = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true, features = ["test-support"] }
project = { workspace = true, features = ["test-support"] }
remote_connection = { workspace = true, features = ["test-support"] }
settings = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
theme.workspace = true
theme_settings.workspace = true
workspace = { workspace = true, features = ["test-support"] }

[package.metadata.cargo-shear]
# `project`'s test support adds a mock remote connection, which
# `remote_connection` only compiles with its own `test-support` feature on.
ignored = ["remote_connection"]
